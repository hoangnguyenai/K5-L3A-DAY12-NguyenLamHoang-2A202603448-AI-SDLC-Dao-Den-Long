<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101421">
  <title>Đảo Đèn Lồng — Đêm 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game" id="game" data-mode="menu">
    <div class="sky" aria-hidden="true"><div class="stars"></div><div class="moon"></div></div>
    <canvas id="scene" aria-label="Thế giới 3D của Đảo Bến"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>Đảo Đèn Lồng</span></div>
      <span class="chapter">Đêm 1 <span aria-hidden="true">/</span> Đảo Bến</span>
      <button type="button" id="pause" class="plain" hidden>Tạm dừng <kbd>Esc</kbd></button>
    </header>

    <section id="intro" class="intro" aria-labelledby="title">
      <p class="eyebrow"><span aria-hidden="true">✧</span> Đêm 1 <span aria-hidden="true">·</span> Đảo Bến</p>
      <h1 id="title">Đảo Đèn Lồng</h1>
      <p class="intro-copy">Sương đen đã phủ Đảo Bến. Hãy cùng Mây gom đom đóm và thắp lại năm chiếc đèn trước bình minh.</p>
      <button type="button" class="primary" id="start">Bắt đầu chơi <span aria-hidden="true">→</span></button>
      <p id="load-error" role="alert" hidden></p>
    </section>

    <section id="hud" class="hud" aria-label="Trạng thái trò chơi" hidden>
      <div class="hud-top">
        <div class="panel resources">
          <div><span class="hud-label">Sinh lực</span><strong id="flames" class="flames"></strong></div>
          <div><span class="hud-label">Đom đóm</span><strong id="carried" class="resource-value"></strong></div>
          <div><span class="hud-label">Điểm</span><strong id="score" class="resource-value"></strong></div>
        </div>
        <div class="panel objective">
          <div class="objective-line"><span class="hud-label">Đèn đã thắp</span><strong id="lantern-count"></strong></div>
          <div id="lantern-pips" class="pips" aria-hidden="true"></div>
          <div class="objective-line"><span class="hud-label">Đến bình minh</span><time id="clock"></time></div>
          <canvas id="map" width="150" height="150" aria-label="Bản đồ vị trí của Mây và các Đèn Lồng Lớn"></canvas>
        </div>
      </div>
      <div class="feedback" aria-live="polite"><span id="notice" hidden></span><span id="prompt" hidden></span></div>
    </section>

    <section id="overlay" class="overlay" aria-labelledby="overlay-title" hidden>
      <div class="dialog panel">
        <p class="eyebrow" id="overlay-tag"></p>
        <h2 id="overlay-title"></h2>
        <p id="overlay-description"></p>
        <button type="button" id="overlay-action" class="primary"></button>
      </div>
    </section>

    <footer class="footer">
      <div class="keys" aria-label="Điều khiển">
        <span><kbd>W A S D</kbd> Di chuyển</span>
        <span><kbd>Space</kbd> Nhảy</span>
        <span><kbd>Q</kbd> <kbd>R</kbd> Xoay góc nhìn</span>
        <span><kbd>E</kbd> Nạp đèn</span>
        <span><kbd>F</kbd> Tỏa sáng</span>
      </div>
      <div id="touch" class="touch" aria-label="Điều khiển cảm ứng" hidden>
        <div class="dpad">
          <button type="button" data-key="KeyW" aria-label="Tiến">↑</button>
          <button type="button" data-key="KeyA" aria-label="Sang trái">←</button>
          <button type="button" data-key="KeyS" aria-label="Lùi">↓</button>
          <button type="button" data-key="KeyD" aria-label="Sang phải">→</button>
        </div>
        <div class="actions">
          <button type="button" data-key="Space">Nhảy</button>
          <button type="button" data-key="KeyE">Nạp đèn</button>
          <button type="button" data-key="KeyF">Tỏa sáng</button>
        </div>
      </div>
    </footer>
  </main>
  <script type="module" src="src/browser.mjs"></script>
</body>
</html>
